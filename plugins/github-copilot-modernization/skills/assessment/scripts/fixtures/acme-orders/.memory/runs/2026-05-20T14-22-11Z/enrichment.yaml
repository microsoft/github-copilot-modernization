    Assumes the modest workload profile we saw in `findings.yaml` (≤ 100 RPM sustained,
    single-region deployment, managed-identity auth throughout). Production traffic would
    push monthly cost toward the upper bound and may require Premium tiers for Service Bus
    (geo-replication) and PostgreSQL (zone redundancy).

