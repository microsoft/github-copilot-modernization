  # ── Cloud readiness (AppCAT) ────────────────────────────────────────
  - id: appcat::file-system-management::8b1f2c0a4d33
    skill: appcat::file-system-management
    source: appcat
    severity: medium
    title: "Local file-system usage incompatible with stateless containers"
    location: "src/main/java/com/acme/orders/io/Reader.java"
    line: 23
    occurrences: 5
    effort: 3
    rationale: |
      The application uses Java NIO for file-system access. To migrate to Azure, consider:

       * Use **Azure Files**: Replace local NIO paths with Azure Files SMB shares mounted into the container.
       * Use **Azure Blob Storage**: For append-only or large-object workloads, switch to the Azure Blob SDK.
       * Use **ephemeral storage** only for scratch space that does not need to survive container restarts.
    links:
      - url: "https://learn.microsoft.com/azure/storage/files/storage-files-introduction"
        title: "Azure Files documentation"
    locations:
